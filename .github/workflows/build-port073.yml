name: Build experimental 0.7.3 Android components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    name: Build 0.7.3 Android managed components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            9.0.x
      - name: Build managed projects with Android conditionals
        shell: bash
        working-directory: AndroidPort073/upstream
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/managed073.log"
          exec > >(tee "$log") 2>&1
          trap 'code=$?; if [[ $code -ne 0 ]]; then tail -25 "$log" | while IFS= read -r line; do echo "::error::${line//%/%25}"; done; fi' EXIT
          common=(
            -c Release
            -p:AndroidPort=true
            -p:ForceRID=linux-arm64
            -p:RuntimeIdentifiers=linux-arm64
            -p:TargetFrameworks=net6
            -p:SolutionDir="$PWD/"
            -p:CopyLocalLockFileAssemblies=true
            -p:GenerateRuntimeConfigurationFiles=true
            -p:RollForward=Major
          )
          dotnet build MelonLoader.NativeHost/MelonLoader.NativeHost.csproj "${common[@]}"
          dotnet build Dependencies/SupportModules/Il2Cpp/Il2Cpp.csproj "${common[@]}"
          dotnet build Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.csproj "${common[@]}"
          output=Output/Release/linux-arm64/MelonLoader
          test -f "$output/net6/MelonLoader.dll"
          test -f "$output/net6/MelonLoader.NativeHost.dll"
          test -f "$output/net6/MelonLoader.runtimeconfig.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["runtimeOptions"]["rollForward"] == "Major"' "$output/net6/MelonLoader.runtimeconfig.json"
          test -f "$output/Dependencies/SupportModules/Il2Cpp.dll"
          test -f "$output/Dependencies/Il2CppAssemblyGenerator/Il2CppAssemblyGenerator.dll"
      - name: Upload experimental managed components (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: melonloader-073-android-managed-experimental
          path: AndroidPort073/upstream/Output/Release/linux-arm64/MelonLoader/
          if-no-files-found: error

  bridge:
    name: Build Android ARM64 JNI bridge and Java dex
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Build JNI bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S AndroidPort073/native -B "${RUNNER_TEMP}/melon073-native" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/melon073-native" --parallel
          mkdir -p "${RUNNER_TEMP}/melon073-components/lib/arm64-v8a"
          cp "${RUNNER_TEMP}/melon073-native/libmelonloader073_bridge.so" "${RUNNER_TEMP}/melon073-components/lib/arm64-v8a/"
      - name: Compile Java entry point and generate dex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/melon073-classes" "${RUNNER_TEMP}/melon073-components/dex"
          javac --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar:JavaBindings/deps/dexpatcher_annotations.jar" \
            -d "${RUNNER_TEMP}/melon073-classes" \
            AndroidPort073/java/com/melonloader/port073/Loader073.java \
            AndroidPort073/java/com/unity3d/player/UnityPlayerActivity.java
          jar --create --file "${RUNNER_TEMP}/melon073-java.jar" -C "${RUNNER_TEMP}/melon073-classes" .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 23 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --classpath JavaBindings/deps/dexpatcher_annotations.jar \
            --output "${RUNNER_TEMP}/melon073-components/dex" "${RUNNER_TEMP}/melon073-java.jar"
          test -f "${RUNNER_TEMP}/melon073-components/dex/classes.dex"
      - name: Test lifecycle hook against synthetic dex with real DexPatcher
        shell: bash
        run: AndroidPort073/tests/test-dex-hook.sh
      - name: Upload experimental bridge components (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: melonloader-073-android-arm64-bridge-experimental
          path: ${{ runner.temp }}/melon073-components/
          if-no-files-found: error

  bootstrap:
    name: Build experimental ARM64 Android NativeAOT bootstrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Install Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"'
      - name: Compile and inspect NativeAOT bootstrap
        shell: bash
        working-directory: AndroidPort073/upstream
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bootstrap073.log"
          exec > >(tee "$log") 2>&1
          trap 'code=$?; if [[ $code -ne 0 ]]; then tail -25 "$log" | while IFS= read -r line; do echo "::error::${line//%/%25}"; done; fi' EXIT
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          dotnet publish MelonLoader.Bootstrap/MelonLoader.Bootstrap.csproj \
            -c Release -r linux-bionic-arm64 \
            -p:RuntimeIdentifiers=linux-bionic-arm64 -p:AndroidPort=true \
            -p:SolutionDir="$PWD/" -p:AppHostVersion=9.0.0 \
            -p:DisableUnsupportedError=true -p:PublishAotUsingRuntimePack=true \
            -p:SkipPublishAfterBuild=true -o "$RUNNER_TEMP/bootstrap"
          library="$RUNNER_TEMP/bootstrap/MelonLoader.Bootstrap.so"
          test -f "$library"
          readelf -h "$library" | grep 'AArch64' >/dev/null
          readelf --dyn-syms -W "$library" | grep ' MelonLoaderAndroidInitialize$' >/dev/null
          if readelf -d "$library" | grep 'libc.so.6' >/dev/null; then echo '::error::glibc dependency in Android bootstrap'; exit 1; fi
          mv "$library" "$RUNNER_TEMP/bootstrap/libMelonLoader.Bootstrap.so"
      - uses: actions/upload-artifact@v4
        with:
          name: melonloader-073-android-arm64-bootstrap-experimental
          path: ${{ runner.temp }}/bootstrap/
          if-no-files-found: error

  reference-runtime:
    name: Retrieve reference ARM64 Android .NET 8 runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify pinned LemonLoader reference runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/LemonLoader/MelonLoader/releases/download/0.6.5.1/melon_data.zip \
            -o "$RUNNER_TEMP/melon-data.zip"
          echo '1c8bab9b0bf7a462f5efe03e8dc253f0f520357915641669d0910f6a9800f3a6  '"$RUNNER_TEMP/melon-data.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/reference-runtime"
          unzip -q "$RUNNER_TEMP/melon-data.zip" 'dotnet/*' -d "$RUNNER_TEMP/reference-runtime"
          runtime="$RUNNER_TEMP/reference-runtime/dotnet"
          for so in "$runtime/host/fxr/8.0.6/libhostfxr.so" "$runtime/shared/Microsoft.NETCore.App/8.0.6/libcoreclr.so"; do
            test -f "$so"
            readelf -h "$so" | grep 'AArch64' >/dev/null
            if readelf -d "$so" | grep 'libc.so.6' >/dev/null; then echo '::error::glibc dependency in Android runtime'; exit 1; fi
          done
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/dotnet/runtime/v8.0.6/LICENSE.TXT -o "$RUNNER_TEMP/reference-runtime/DOTNET-LICENSE.txt"
          printf '%s\n' 'Reference runtime extracted from LemonLoader 0.6.5.1 melon_data.zip.' 'SHA-256: 1c8bab9b0bf7a462f5efe03e8dc253f0f520357915641669d0910f6a9800f3a6' 'Experimental, not verified with this 0.7.3 port or on a device.' > "$RUNNER_TEMP/reference-runtime/PROVENANCE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: melonloader-073-android-dotnet8-reference-experimental
          path: ${{ runner.temp }}/reference-runtime/
          if-no-files-found: error
